{% extends "auth_base.html" %}{% block title %}Forgot Password | SmartClass{% endblock %}{% block content %}
<h2>Forgot your password?</h2><div class="subtitle">Enter your registered email and SmartClass will create a secure reset request.</div>
<form method="POST"><div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div><button class="btn btn-primary" style="width:100%">Create Reset Request</button></form>
<div class="auth-links"><a href="{{ url_for('login') }}">← Back to login</a></div>
{% endblock %}
