{% extends "auth_base.html" %}{% block title %}Login | SmartClass{% endblock %}{% block content %}
<h2>Welcome back 👋</h2><div class="subtitle">Sign in to continue to your SmartClass workspace.</div>
<form method="POST"><div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required autofocus></div>
<div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
<button class="btn btn-primary" style="width:100%">Login →</button></form>
<div class="auth-links"><a href="{{ url_for('forgot_password') }}">Forgot password?</a><a href="{{ url_for('register') }}">Create account</a></div>
{% endblock %}
