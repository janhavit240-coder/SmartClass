{% extends "auth_base.html" %}{% block title %}Create Account | SmartClass{% endblock %}{% block content %}
<h2>Create your account ✨</h2><div class="subtitle">Set up your private SmartClass workspace.</div>
<form method="POST"><div class="form-group"><label>Name</label><input type="text" name="name" placeholder="Your name" required></div><div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div><div class="form-group"><label>Password</label><input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></div><button class="btn btn-primary" style="width:100%">Create Account →</button></form>
<div class="auth-links"><a href="{{ url_for('login') }}">← Back to login</a></div>
{% endblock %}
