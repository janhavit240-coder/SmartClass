{% extends "auth_base.html" %}{% block title %}Reset Password | SmartClass{% endblock %}{% block content %}
<h2>Set a new password 🔐</h2><div class="subtitle">Choose a new password for your SmartClass account.</div>
<form method="POST"><div class="form-group"><label>Reset Token</label><input type="text" name="token" value="{{ token or '' }}" placeholder="Paste your reset token" required></div><div class="form-group"><label>New Password</label><input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></div><button class="btn btn-primary" style="width:100%">Reset Password</button></form>
<div class="auth-links"><a href="{{ url_for('login') }}">← Back to login</a></div>
{% endblock %}
